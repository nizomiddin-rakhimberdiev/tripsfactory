# Deploy to Cloudflare Workers.
#
# Inert until the Cloudflare account exists: if CLOUDFLARE_API_TOKEN is not set
# in repository secrets, every step is skipped and the run passes. That keeps
# pushes green during the migration instead of failing on each one.
#
# To activate, add these repository secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens (Workers edit)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers → Account ID
#   R2_*                   whatever the storage adapter needs at build time
#
# IMPORTANT — importMap.js: Payload regenerates
# src/app/(payload)/admin/importMap.js on every build, and it only contains
# entries for plugins active at build time. The storage plugin's env vars must
# therefore be present in the Deploy step below, or the production /admin
# renders a blank page. See AGENTS.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.creds.outputs.ready == 'true'
        run: npx tsc --noEmit

      - name: Build and deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://tripsfactory.uz
          # Storage plugin env goes here too — see the importMap note above.
        run: |
          npx opennextjs-cloudflare build
          npx wrangler deploy
